<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <label for="target_time">Target time:</label>
    <input type="text" name="target_time" id="target_time" value="02:00">
    <br>
    <label for="notification_duration">Notification duration:</label>
    <input type="number" name="notification_duration" id="notification_duration" value="60">
    <br>
    <label for="notification_interval">Notification interval:</label>
    <input type="number" name="notification_interval" id="notification_interval" value="600">
    <br>
    <label for="script_version">Script version:</label>
    <select name="script_version" id="script_version">
        <option value="notification">Notification</option>
        <option value="activity">Activity</option>
    </select>
    <br>
    <button onclick="save()">Save</button>
</body>
<script>
    const api = pywebview.api;

    function save() {
        target_time_value = document.getElementById("target_time").value
        notification_duration_value = document.getElementById("notification_duration").value
        notification_interval_value = document.getElementById("notification_interval").value
        script_version_value = document.getElementById("script_version").value
        pywebview.api.save(target_time_value, notification_duration_value, notification_interval_value, script_version_value);
    }
</script>
</html>
